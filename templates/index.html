<!DOCTYPE html>
<html lang="pt-br" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Bugs | Dark Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 transition-colors duration-300">
    
    <div class="max-w-2xl w-full bg-slate-800 rounded-xl shadow-2xl border border-slate-700 p-8">
        <h1 class="text-2xl font-bold text-white mb-6 flex items-center gap-2">
            <span class="p-2 bg-blue-600/20 rounded-lg">🛡️</span> 
            Verificador de Bugs Duplicados
        </h1>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-400 mb-2">Descreva o problema encontrado:</label>
                <textarea id="userInput" rows="5" 
                    class="w-full p-4 bg-slate-900 border border-slate-700 rounded-lg text-slate-200 placeholder-slate-500 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition resize-none" 
                    placeholder="Cole aqui os detalhes do bug para análise..."></textarea>
            </div>

            <button onclick="analisarJira()" id="btnAnalisar" 
                class="w-full bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-semibold py-3 rounded-lg transition-all flex items-center justify-center gap-3 shadow-lg shadow-blue-900/20">
                <span id="btnText">Analisar no Jira</span>
                <div id="loader" class="hidden animate-spin h-5 w-5 border-2 border-white border-t-transparent rounded-full"></div>
            </button>

            <div id="resultBox" class="hidden mt-6 p-5 rounded-lg border transition-all duration-500">
                <h3 class="font-bold text-sm uppercase tracking-wider mb-3 opacity-80">Resultado da Análise</h3>
                <p id="resultText" class="text-slate-200 leading-relaxed whitespace-pre-wrap"></p>
            </div>
        </div>
        
        <footer class="mt-8 text-center">
            <p class="text-xs text-slate-500 italic">by Suporte Team</p>
        </footer>
    </div>

    <script>
        async function analisarJira() {
            const input = document.getElementById('userInput').value;
            const btn = document.getElementById('btnAnalisar');
            const loader = document.getElementById('loader');
            const resultBox = document.getElementById('resultBox');
            const resultText = document.getElementById('resultText');

            if (!input.trim()) { 
                alert("⚠️ A descrição é obrigatória para a análise."); 
                return; 
            }

            // UI State: Loading
            btn.disabled = true;
            btn.classList.add('opacity-70', 'cursor-not-allowed');
            loader.classList.remove('hidden');
            resultBox.classList.add('hidden');

            try {
                const response = await fetch('/analisar', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({description: input})
                });

                const data = await response.json();

                if (response.ok) {
                    // Estilo Sucesso (Dark Green)
                    resultBox.className = "mt-6 p-5 rounded-lg border border-emerald-500/30 bg-emerald-500/10 text-emerald-200 shadow-inner";
                    resultText.innerText = data.resultado;
                } else {
                    throw new Error(data.error || "Erro na comunicação com o servidor.");
                }
            } catch (err) {
                // Estilo Erro (Dark Red)
                resultBox.className = "mt-6 p-5 rounded-lg border border-rose-500/30 bg-rose-500/10 text-rose-200";
                resultText.innerText = "❌ Ops! " + err.message;
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-70', 'cursor-not-allowed');
                loader.classList.add('hidden');
                resultBox.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
